<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sweetshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
           
            background-color: #fff8f0;
            color: #333;
        }
        header {
            background-color: #ff6f61;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin-bottom: 10px;
            text-align: center;
        }
        header p {
            margin: 0;
        }
        nav {
            background-color: #ffb347;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        section {
            padding: 20px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: space-around;
        }
        .card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 200px;
            margin: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 150px;
            border-bottom: 1px solid #ddd;
        }
        .card h3 {
            margin: 10px ;
        }
        .card p {
            color: red;
            font-weight: bold;
            font-size: 16px;
        }
        .card button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .card button:hover {
            background-color: darkblue;
        }
        footer {
            background-color: #ff6f61;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
        }
    </style>
    
</head>
<body>
    <header>
        <h1>Rehan Sweet Shop </h1>
        <p>Fresh and Delicious Indian Sweets</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Sweets</a>
        <a href="#">Offers</a>
        <a href="#">Contact</a>
    </nav>
    <section class="pro">
        <h2> Welcome to Our Sweet Shop </h2>
        <p>Enjoy Fresh & Pure Indian Sweets Everyday!</p>
    </section>
    <section class="products">
        <div class="card">
            <img src="gulab-jamun.webp" alt="Gulab Jamun">
            <h3>Gulab Jamun</h3>
            <p>$20.00/kg</p>
            <button>Order Now</button>
        </div>
        <div class="card">
            <img src="gujiya.webp" alt="Gujiya">
            <h3>Gujiya</h3>
            <p>$12.00/kg</p>
            <button>Order Now</button>
        </div>
        <div class="card">
            <img src="kaju-katli.webp" alt="Kaju-Katli">
            <h3>Kaju-Katli</h3>
            <p>$25.00/kg</p>
            <button>Order Now</button>
        </div>
        <div class="card">
            <img src="rajbhog.webp" alt="Rajbhog">
            <h3>Rajbhog</h3>
            <p>$30.00/kg</p>
            <button>Order Now</button>
        </div>
    </section>
    <footer>
        <p>&copy;2026 Rehan Sweet Shop. All Rights Reserved</p>
    </footer>    
</body>
</html>
